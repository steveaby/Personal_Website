<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="background-color: #000000;">
  <defs>
    <!-- Complex Neon Glow Filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for the 'S' -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Pure Black Background -->
  <rect width="100" height="100" fill="#000000" />

  <!-- HIGH-DENSITY MOTHERBOARD TRACES -->
  <g fill="none" stroke="#00E5FF" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Ultra-dense background layer (thin lines) -->
    <g stroke-width="0.15" opacity="0.25">
      <!-- Top Left Routing -->
      <path d="M 0 5 L 8 5 L 12 9 L 12 20 L 15 23 L 30 23 L 35 28 L 35 45" />
      <path d="M 0 8 L 6 8 L 10 12 L 10 22 L 13 25 L 28 25 L 33 30 L 33 45" />
      <path d="M 0 11 L 4 11 L 8 15 L 8 24 L 11 27 L 26 27 L 31 32 L 31 45" />
      <path d="M 15 0 L 15 8 L 19 12 L 40 12 L 45 17 L 45 40" />
      <path d="M 18 0 L 18 6 L 22 10 L 38 10 L 43 15 L 43 40" />
      <path d="M 21 0 L 21 4 L 25 8 L 36 8 L 41 13 L 41 40" />
      
      <!-- Top Right Routing -->
      <path d="M 100 5 L 92 5 L 88 9 L 88 20 L 85 23 L 70 23 L 65 28 L 65 45" />
      <path d="M 100 8 L 94 8 L 90 12 L 90 22 L 87 25 L 72 25 L 67 30 L 67 45" />
      <path d="M 100 11 L 96 11 L 92 15 L 92 24 L 89 27 L 74 27 L 69 32 L 69 45" />
      <path d="M 85 0 L 85 8 L 81 12 L 60 12 L 55 17 L 55 40" />
      <path d="M 82 0 L 82 6 L 78 10 L 62 10 L 57 15 L 57 40" />
      <path d="M 79 0 L 79 4 L 75 8 L 64 8 L 59 13 L 59 40" />

      <!-- Bottom Left Routing -->
      <path d="M 0 95 L 8 95 L 12 91 L 12 80 L 15 77 L 30 77 L 35 72 L 35 55" />
      <path d="M 0 92 L 6 92 L 10 88 L 10 78 L 13 75 L 28 75 L 33 70 L 33 55" />
      <path d="M 0 89 L 4 89 L 8 85 L 8 76 L 11 73 L 26 73 L 31 68 L 31 55" />
      <path d="M 15 100 L 15 92 L 19 88 L 40 88 L 45 83 L 45 60" />
      <path d="M 18 100 L 18 94 L 22 90 L 38 90 L 43 85 L 43 60" />
      <path d="M 21 100 L 21 96 L 25 92 L 36 92 L 41 87 L 41 60" />

      <!-- Bottom Right Routing -->
      <path d="M 100 95 L 92 95 L 88 91 L 88 80 L 85 77 L 70 77 L 65 72 L 65 55" />
      <path d="M 100 92 L 94 92 L 90 88 L 90 78 L 87 75 L 72 75 L 67 70 L 67 55" />
      <path d="M 100 89 L 96 89 L 92 85 L 92 76 L 89 73 L 74 73 L 69 68 L 69 55" />
      <path d="M 85 100 L 85 92 L 81 88 L 60 88 L 55 83 L 55 60" />
      <path d="M 82 100 L 82 94 L 78 90 L 62 90 L 57 85 L 57 60" />
      <path d="M 79 100 L 79 96 L 75 92 L 64 92 L 59 87 L 59 60" />
      
      <!-- Central Core Routing (Behind S) -->
      <path d="M 47 0 L 47 15 L 50 18 L 50 82 L 47 85 L 47 100" />
      <path d="M 49 0 L 49 17 L 52 20 L 52 80 L 49 83 L 49 100" />
      <path d="M 51 0 L 51 17 L 48 20 L 48 80 L 51 83 L 51 100" />
      <path d="M 53 0 L 53 15 L 50 18 L 50 82 L 53 85 L 53 100" />
    </g>

    <!-- Medium thickness accent traces with vias (solder pads) -->
    <g stroke-width="0.3" opacity="0.4">
      <path d="M 5 35 L 12 35 L 18 41 L 18 59 L 12 65 L 5 65" />
      <path d="M 95 35 L 88 35 L 82 41 L 82 59 L 88 65 L 95 65" />
      <path d="M 35 5 L 35 12 L 41 18 L 59 18 L 65 12 L 65 5" />
      <path d="M 35 95 L 35 88 L 41 82 L 59 82 L 65 88 L 65 95" />
      
      <!-- Solder pads/Vias -->
      <g fill="#00E5FF" stroke="none">
        <circle cx="5" cy="35" r="0.6" />
        <circle cx="5" cy="65" r="0.6" />
        <circle cx="95" cy="35" r="0.6" />
        <circle cx="95" cy="65" r="0.6" />
        <circle cx="35" cy="5" r="0.6" />
        <circle cx="65" cy="5" r="0.6" />
        <circle cx="35" cy="95" r="0.6" />
        <circle cx="65" cy="95" r="0.6" />
      </g>
    </g>

    <!-- Increased Animated Tracing Pulses (Simulating active data across more lines) -->
    <g stroke-width="0.6" opacity="0.9">
      <!-- Top Left pulses -->
      <path d="M 0 11 L 4 11 L 8 15 L 8 24 L 11 27 L 26 27 L 31 32 L 31 45" stroke-dasharray="120" stroke-dashoffset="120">
        <animate attributeName="stroke-dashoffset" from="120" to="-120" dur="4s" repeatCount="indefinite" />
      </path>
      <path d="M 15 0 L 15 8 L 19 12 L 40 12 L 45 17 L 45 40" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" from="100" to="-100" dur="3.5s" begin="1.2s" repeatCount="indefinite" />
      </path>
      
      <!-- Top Right pulses -->
      <path d="M 100 11 L 96 11 L 92 15 L 92 24 L 89 27 L 74 27 L 69 32 L 69 45" stroke-dasharray="120" stroke-dashoffset="120">
        <animate attributeName="stroke-dashoffset" from="120" to="-120" dur="4.2s" begin="0.8s" repeatCount="indefinite" />
      </path>
      <path d="M 85 0 L 85 8 L 81 12 L 60 12 L 55 17 L 55 40" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" from="100" to="-100" dur="3.8s" begin="2.1s" repeatCount="indefinite" />
      </path>

      <!-- Bottom Left pulses -->
      <path d="M 0 89 L 4 89 L 8 85 L 8 76 L 11 73 L 26 73 L 31 68 L 31 55" stroke-dasharray="120" stroke-dashoffset="120">
        <animate attributeName="stroke-dashoffset" from="120" to="-120" dur="4s" begin="2s" repeatCount="indefinite" />
      </path>
      <path d="M 15 100 L 15 92 L 19 88 L 40 88 L 45 83 L 45 60" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" from="100" to="-100" dur="3.6s" begin="0.5s" repeatCount="indefinite" />
      </path>

      <!-- Bottom Right pulses -->
      <path d="M 100 89 L 96 89 L 92 85 L 92 76 L 89 73 L 74 73 L 69 68 L 69 55" stroke-dasharray="120" stroke-dashoffset="120">
        <animate attributeName="stroke-dashoffset" from="120" to="-120" dur="4.5s" begin="1.5s" repeatCount="indefinite" />
      </path>
      <path d="M 85 100 L 85 92 L 81 88 L 60 88 L 55 83 L 55 60" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" from="100" to="-100" dur="3.4s" begin="2.8s" repeatCount="indefinite" />
      </path>

      <!-- Central Vertical pulses -->
      <path d="M 47 0 L 47 15 L 50 18 L 50 82 L 47 85 L 47 100" stroke-dasharray="80" stroke-dashoffset="80">
        <animate attributeName="stroke-dashoffset" from="80" to="-80" dur="3s" begin="1s" repeatCount="indefinite" />
      </path>
      <path d="M 53 100 L 53 85 L 50 82 L 50 18 L 53 15 L 53 0" stroke-dasharray="80" stroke-dashoffset="80">
        <animate attributeName="stroke-dashoffset" from="80" to="-80" dur="3s" begin="2.5s" repeatCount="indefinite" />
      </path>

      <!-- Side Accent Pulses -->
      <path d="M 5 35 L 12 35 L 18 41 L 18 59 L 12 65 L 5 65" stroke-dasharray="60" stroke-dashoffset="60">
        <animate attributeName="stroke-dashoffset" from="60" to="-60" dur="2.5s" begin="0.3s" repeatCount="indefinite" />
      </path>
      <path d="M 95 65 L 88 65 L 82 59 L 82 41 L 88 35 L 95 35" stroke-dasharray="60" stroke-dashoffset="60">
        <animate attributeName="stroke-dashoffset" from="60" to="-60" dur="2.5s" begin="1.8s" repeatCount="indefinite" />
      </path>
    </g>
  </g>

  <!-- Glowing Multi-Layered Brackets -->
  <g filter="url(#neon-glow)" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    
    <!-- LEFT BRACKET -->
    <path d="M 32 15 L 20 15 L 12 23 L 12 77 L 20 85 L 32 85" stroke="#00BFFF" stroke-width="3" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M 32 19 L 22 19 L 15.5 25.5 L 15.5 74.5 L 22 81 L 32 81" stroke="#00E5FF" stroke-width="1.2" opacity="0.9" />
    <path d="M 32 23 L 24 23 L 19 28 L 19 72 L 24 77 L 32 77" stroke="#00BFFF" stroke-width="2" opacity="0.7">
       <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M 32 15 L 20 15 L 12 23 L 12 77 L 20 85 L 32 85" stroke="#FFFFFF" stroke-width="0.8" />
    <path d="M 32 23 L 24 23 L 19 28 L 19 72 L 24 77 L 32 77" stroke="#E0FFFF" stroke-width="0.6" />

    <!-- RIGHT BRACKET -->
    <path d="M 68 15 L 80 15 L 88 23 L 88 77 L 80 85 L 68 85" stroke="#00BFFF" stroke-width="3" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" begin="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M 68 19 L 78 19 L 84.5 25.5 L 84.5 74.5 L 78 81 L 68 81" stroke="#00E5FF" stroke-width="1.2" opacity="0.9" />
    <path d="M 68 23 L 76 23 L 81 28 L 81 72 L 76 77 L 68 77" stroke="#00BFFF" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" begin="2s" repeatCount="indefinite" />
    </path>
    <path d="M 68 15 L 80 15 L 88 23 L 88 77 L 80 85 L 68 85" stroke="#FFFFFF" stroke-width="0.8" />
    <path d="M 68 23 L 76 23 L 81 28 L 81 72 L 76 77 L 68 77" stroke="#E0FFFF" stroke-width="0.6" />
  </g>

  <!-- Animated Data Particles (Traveling along the inner bracket tracks) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round">
    <path d="M 32 19 L 22 19 L 15.5 25.5 L 15.5 74.5 L 22 81 L 32 81" stroke-dasharray="1 45" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M 68 81 L 78 81 L 84.5 74.5 L 84.5 25.5 L 78 19 L 68 19" stroke-dasharray="1 45" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="90" to="0" dur="2s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Central 'S' - Solid Pure White -->
  <text x="50" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#FFFFFF" filter="url(#drop-shadow)" text-anchor="middle" dominant-baseline="central">S</text>
</svg>
